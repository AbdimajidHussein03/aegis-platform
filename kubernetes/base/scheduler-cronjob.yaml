
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduler
  namespace: aegis

spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure

          containers:
            - name: scheduler
              image: acraegisdev01.azurecr.io/aegis-backend:v1
              imagePullPolicy: IfNotPresent

              command:
                - php
                - artisan
                - schedule:run
                - "--verbose"
                - "--no-interaction"

              envFrom:
                - configMapRef:
                    name: backend-config

              env:
                - name: APP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: APP_KEY

                - name: JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: JWT_SECRET

                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
