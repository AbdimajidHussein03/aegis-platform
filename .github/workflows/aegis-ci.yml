
name: Aegis CI - Build and Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Scan ${{ matrix.component }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./hi-events/backend
            dockerfile: ./hi-events/backend/Dockerfile

          - component: frontend
            context: ./hi-events/frontend
            dockerfile: ./hi-events/frontend/Dockerfile.ssr

    steps:
      - name: Checkout Aegis repository
        uses: actions/checkout@v4

      - name: Checkout Hi.Events source
        uses: actions/checkout@v4
        with:
          repository: HiEventsDev/hi.events
          ref: 303f4cc0cd5786a1807e1e2485e1c0ae27637b36
          path: hi-events

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: aegis-${{ matrix.component }}:ci

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegis-${{ matrix.component }}:ci
          format: json
          output: trivy-${{ matrix.component }}.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Upload Trivy vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}-report
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegis-${{ matrix.component }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.component }}.json
          exit-code: '0'

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 14
